<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}@media (min-width:501px){:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}.thumb{container-type:inline-size;background:#111}
.mth{position:absolute;inset:0;overflow:hidden;background:var(--bg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
.mth-txt{position:absolute;z-index:2;left:7%;bottom:12%;max-width:62%}
.mth-txt b{display:block;font-size:17cqw;line-height:1;font-weight:900;color:var(--fg);letter-spacing:-.02em;text-shadow:0 .8cqw 0 rgba(0,0,0,.6)}
.mth-txt small{display:inline-block;margin-top:2cqw;font-size:4.2cqw;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:.6cqw 2cqw}
.mth.archive{background:radial-gradient(70% 90% at 80% 30%,rgba(255,255,255,.06),transparent 70%),var(--bg)}
.mth-paper{position:absolute;right:5%;top:10%;width:36%;height:74%;background:#e8e0cc;transform:rotate(6deg);box-shadow:0 2cqw 4cqw rgba(0,0,0,.6);padding:5cqw 3cqw;display:flex;flex-direction:column;gap:2.2cqw}
.mth-paper i{display:block;height:1.4cqw;background:#9a917e}
.mth-paper i.r{background:#111;height:2.4cqw}
.mth-paper i.s{width:60%}
.mth-tape{position:absolute;left:-10%;right:-10%;top:3%;background:#f2c94c;color:#111;font-size:3.4cqw;font-weight:900;white-space:nowrap;padding:.8cqw 0;transform:rotate(-8deg);z-index:1;box-shadow:0 1cqw 2cqw rgba(0,0,0,.4)}
.mth-stamp{display:inline-block;border:.8cqw solid #e0453a;color:#e0453a;font-size:4.4cqw;font-weight:900;padding:.4cqw 2cqw;transform:rotate(-6deg);margin-bottom:2cqw}
.mth.night{background:radial-gradient(60% 80% at 78% 28%,rgba(123,141,179,.35),transparent 70%),var(--bg)}
.mth-moon{position:absolute;right:12%;top:12%;width:16cqw;height:16cqw;border-radius:50%;box-shadow:-3cqw 2cqw 0 0 #e9e4d4}
.mth-q{position:absolute;right:8%;bottom:-6%;font-size:42cqw;font-weight:900;line-height:1;color:var(--fg);opacity:.16}
.mth-chip{display:inline-block;background:var(--fg);color:#111;font-size:3.6cqw;font-weight:800;padding:.6cqw 2cqw;border-radius:1cqw;margin-bottom:2cqw}
.mth.news{background:linear-gradient(180deg,var(--bg),#050c18)}
.mth-city{position:absolute;left:0;right:0;bottom:22%;width:100%;height:30%}
.mth-logo{position:absolute;left:4%;top:7%;background:#e0453a;color:#fff;font:900 4.6cqw/1 Helvetica,Arial,sans-serif;padding:1.2cqw 2cqw;letter-spacing:.06em}
.mth-live{position:absolute;left:19%;top:7%;background:#fff;color:#0d2340;font-size:3.6cqw;font-weight:800;padding:1.3cqw 2cqw}
.mth-lower{position:absolute;left:0;right:0;bottom:8%;display:flex;align-items:stretch}
.mth-red{background:#e0453a;color:#fff;font-size:8cqw;font-weight:900;padding:1.4cqw 3cqw;line-height:1}
.mth-white{flex:1;background:#fff;color:#111;font-size:5.4cqw;font-weight:800;padding:1.8cqw 3cqw;display:flex;align-items:center}
.mth.doc{background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),radial-gradient(60% 80% at 70% 40%,rgba(255,255,255,.12),transparent 70%),var(--bg)}
.mth-sil{position:absolute;right:6%;bottom:0;width:40%;filter:blur(1.2cqw)}
.mth.doc .mth-txt small{background:none;font-size:5cqw;color:#f0e6d6;padding:0}
.mth.books .mth-shelf{position:absolute;inset:0;width:100%;height:100%;opacity:.85}
.mth.books::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,14,8,.92) 0 45%,rgba(20,14,8,.2))}
.mth.whisky{background:radial-gradient(60% 90% at 75% 50%,rgba(252,203,79,.25),transparent 70%),var(--bg)}
.mth-glass{position:absolute;right:10%;top:10%;width:30%}
.mth.onsen .mth-mt{position:absolute;inset:0;width:100%;height:100%}
.mth-seal{display:grid;place-items:center;width:22cqw;height:22cqw;border-radius:50%;border:.8cqw solid var(--fg);color:var(--fg);font-size:12cqw;font-weight:700;margin-bottom:2cqw}
.thumb .dur,.thumb .bar{z-index:5}
.alarm .grow{flex:1;min-width:0}
</style>
<title>九条 真尋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* 단일 다크 룩. 아이폰 다크 모드 문법을 따르되 아이콘과 그래픽은 전부 새로 그림 */
:root{
  color-scheme: dark;
  --stage:#0b0b0c;
  --bg:#000;
  --cell:#1c1c1e;
  --cell2:#2c2c2e;
  --sep:#38383a;
  --text:#fff;
  --sec:#8e8e93;
  --ter:#636366;
  --tint:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
  --amber:#fccb4f;
  --olive:#666638;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Noto Sans KR",system-ui,sans-serif;
  --font-ko:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans JP",system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;
  box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;-webkit-font-smoothing:antialiased}
body.ko{font-family:var(--font-ko)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
.foot{font-size:11.5px;color:#5c5c60;text-align:center;flex:none}

.phone{position:relative;width:min(390px,100%);height:min(844px,calc(100% - 26px));min-height:560px;border-radius:48px;background:var(--bg);
  box-shadow:0 0 0 10px #1b1b1d,0 0 0 11px #3a3a3c,0 30px 80px rgba(0,0,0,.7);overflow:hidden;flex:none;isolation:isolate}
@media (max-width:440px){.phone{border-radius:34px;box-shadow:0 0 0 5px #1b1b1d,0 0 0 6px #3a3a3c}}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:50;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden]{display:none!important}
.status{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 40px;font-size:16px;font-weight:600;letter-spacing:-.01em;position:relative;z-index:40;font-variant-numeric:tabular-nums}
.status .r{display:flex;gap:6px;align-items:center}
.bat{width:26px;height:12.5px;border:1.2px solid rgba(255,255,255,.45);border-radius:4px;padding:1.5px;position:relative;display:inline-block}
.bat i{display:block;height:100%;width:23%;background:#fff;border-radius:1.5px}
.bat::after{content:"";position:absolute;right:-3.5px;top:3.5px;width:2px;height:4px;background:rgba(255,255,255,.45);border-radius:0 1px 1px 0}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:#fff;z-index:45}
.homebar-hit{position:absolute;left:0;right:0;bottom:0;height:26px;z-index:46}

/* 배경화면 */
.wall{background:
  radial-gradient(90% 55% at 85% 12%,rgba(252,203,79,.45),transparent 62%),
  radial-gradient(80% 50% at 0% 95%,rgba(102,102,56,.55),transparent 65%),
  radial-gradient(60% 40% at 40% 55%,rgba(120,70,20,.35),transparent 70%),
  linear-gradient(170deg,#2a2010 0%,#120e08 55%,#07070a 100%)}

/* 잠금 */
.lock-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 14px 54px;width:100%}
.lock-date{font-size:19px;font-weight:600;color:rgba(255,255,255,.88);margin-top:8px}
.lock-time{font-size:96px;font-weight:700;line-height:1;letter-spacing:-.02em;color:rgba(255,248,232,.95);margin-top:2px;font-variant-numeric:tabular-nums;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Hiragino Sans",system-ui,sans-serif}
.notif{margin-top:auto;width:100%;background:rgba(48,44,38,.62);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:38px 1fr auto;gap:1px 10px;align-items:center;text-align:left}
.notif .aic{grid-row:span 2;width:38px;height:38px;border-radius:9px;overflow:hidden}
.notif .aic svg{width:100%;height:100%;display:block}
.notif b{font-size:15px;font-weight:600}
.notif small{color:rgba(255,255,255,.55);font-size:13px}
.notif p{grid-column:2/4;margin:0;font-size:15px;line-height:1.3}
.lock-row{display:flex;justify-content:space-between;width:100%;padding:18px 34px 0}
.lock-row span{width:50px;height:50px;border-radius:50%;background:rgba(40,36,30,.55);backdrop-filter:blur(10px);display:grid;place-items:center}
.lock-hint{font-size:13px;color:rgba(255,255,255,.6);margin-top:14px}

/* 암호 */
.pin-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px 20px 50px;background:rgba(0,0,0,.35);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);width:100%}
.pin-title{font-size:20px;margin-top:22px}
.dots{display:flex;gap:22px;margin:20px 0 34px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.4px solid #fff}
.dots i.on{background:#fff}
.dots.shake{animation:shake .45s}
@keyframes shake{15%,55%{transform:translateX(-10px)}35%,75%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-align:center}
.key b{font-size:34px;font-weight:400}
.key small{font-size:10px;letter-spacing:.18em;margin-top:2px;font-weight:600}
.key:active{background:rgba(255,255,255,.45)}
.pin-foot{display:flex;justify-content:space-between;width:100%;max-width:290px;margin-top:auto;font-size:16px}
.pin-hint{min-height:40px;margin-top:16px;font-size:14px;color:rgba(255,255,255,.75);text-align:center}

/* 홈 */
.home-body{flex:1;display:flex;flex-direction:column;padding:10px 18px 24px;min-height:0}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.wdg{border-radius:22px;padding:14px 15px;aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.wdg.wx{background:linear-gradient(180deg,#2a6fc0,#4d97e0)}
.wdg.wx .t{font-size:42px;font-weight:300;line-height:1}
.wdg.wx small{font-size:12px;font-weight:600;display:block}
.wdg.cal{background:#fff;color:#000}
.wdg.cal .dw{color:#ff3b30;font-size:12px;font-weight:700;letter-spacing:.02em}
.wdg.cal .dn{font-size:40px;font-weight:300;line-height:1}
.wdg.cal .ev{border-left:3px solid #ff9f0a;padding-left:6px;font-size:12px;line-height:1.3}
.wdg.cal .ev small{color:#8e8e93;display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;width:76px;text-align:center;color:#fff}
.app .ic{width:62px;height:62px;border-radius:14px;overflow:hidden;display:block;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.app .ic svg{width:100%;height:100%;display:block}
.app span.lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.app:active .ic{filter:brightness(.7)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:12px;font-weight:600;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.icw{position:relative}
.pager{display:flex;gap:7px;justify-content:center;margin:auto 0 12px;padding:6px 10px;background:rgba(40,36,30,.4);border-radius:12px;align-self:center}
.pager i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.pager i.on{background:#fff}
.dock{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;background:rgba(60,55,48,.45);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border-radius:32px;padding:14px 6px}
.dock .lb{display:none}

@media (max-height:760px){.widgets{display:none}}
.callv{flex:1;display:flex;flex-direction:column;align-items:center;padding:60px 24px 50px;background:linear-gradient(180deg,#2b2a28,#121212)}
.cst{color:rgba(255,255,255,.7);font-size:16px;text-align:center;min-height:22px}
.cnm{font-size:34px;font-weight:500;margin-top:8px;text-align:center}
.cnum{color:rgba(255,255,255,.6);font-size:15px;margin-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 28px;margin-top:auto;font-size:12px;text-align:center}
.cgrid span{display:flex;flex-direction:column;align-items:center;gap:7px}
.cgrid i{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14)}
.cend{width:74px;height:74px;border-radius:50%;background:#ff3b30;display:grid;place-items:center;margin-top:40px}
/* 앱 공통 */
.app-screen{background:var(--bg)}
#view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.nav{flex:none;display:flex;align-items:center;min-height:44px;padding:0 8px;position:relative}
.nav .bk{color:var(--tint);font-size:17px;display:flex;align-items:center;gap:2px;padding:8px 6px;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .bk svg{flex:none}
.nav .ttl{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.nav .rt{margin-left:auto;color:var(--tint);font-size:17px;padding:8px}
.large{font-size:34px;font-weight:700;margin:0;padding:2px 18px 10px;letter-spacing:-.01em}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:40px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.search{margin:0 16px 12px;background:var(--cell);border-radius:10px;padding:8px 10px;color:var(--sec);font-size:16px;display:flex;gap:6px;align-items:center}
.group{margin:0 16px 22px;background:var(--cell);border-radius:11px;overflow:hidden}
.gtitle{font-size:13px;color:var(--sec);padding:0 32px 6px;text-transform:uppercase}
.cell{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;min-height:44px;position:relative;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell.ind+.cell.ind::before,.cell.ind+.cell::before{left:58px}
.cell .grow{flex:1;min-width:0}
.cell .val{color:var(--sec);font-size:16px}
.chev{color:var(--ter);flex:none}
.sic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none}
.sic svg{width:19px;height:19px}
.toggle{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;flex:none}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
.check{color:var(--tint);font-weight:600}
.empty{color:var(--sec);text-align:center;padding:40px 20px;font-size:15px}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:rgba(44,44,46,.96);padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;max-width:84%;text-align:center;pointer-events:none;transition:opacity .25s;box-shadow:0 8px 30px rgba(0,0,0,.5)}

/* 메시지 */
.trow{display:flex;gap:12px;align-items:center;width:100%;padding:0 0 0 16px;text-align:left}
.trow .tx{flex:1;min-width:0;padding:11px 16px 11px 0;border-bottom:.5px solid var(--sep)}
.trow .tp{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.trow .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tm{color:var(--sec);font-size:14px;flex:none;display:flex;align-items:center;gap:4px}
.trow .pv{color:var(--sec);font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(180deg,#a5a5aa,#7d7d82)}
.av.sm{width:34px;height:34px;font-size:14px}
.av.lg{width:90px;height:90px;font-size:36px}
.av svg{width:60%;height:60%}
.pinned{display:flex;justify-content:center;gap:24px;padding:4px 16px 14px;border-bottom:.5px solid var(--sep)}
.pinned button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sec)}
.pinned .av{width:72px;height:72px;font-size:28px}
.chat-head{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text);padding:0 0 8px;border-bottom:.5px solid var(--sep);background:rgba(28,28,30,.7)}
.chat{padding:8px 14px 18px;display:flex;flex-direction:column}
.cday{align-self:center;font-size:11.5px;color:var(--sec);margin:16px 0 6px;font-weight:500;text-align:center}
.cday b{font-weight:600}
.bub{max-width:76%;padding:8px 13px;border-radius:18px;font-size:16px;line-height:1.4;background:#262628;align-self:flex-start;margin-top:5px;word-break:break-word;position:relative}
.bub.me{background:var(--tint);align-self:flex-end}
.bub.gap{margin-top:14px}
.bub.link,.bub.loc{padding:0;overflow:hidden;width:240px}
.bub .lk-img{height:110px;background:linear-gradient(135deg,#f3e2c6,#d9a066);display:grid;place-items:center}
.bub .lk-tx{padding:8px 12px;background:#2c2c2e}
.bub .lk-tx small{display:block;color:var(--sec);font-size:12px}
.bub .map-img{height:120px;display:block;width:100%}
.read{align-self:flex-end;font-size:11px;color:var(--sec);margin:3px 4px 0}
.compose{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px 30px}
.compose .plus{width:34px;height:34px;border-radius:50%;background:var(--cell2);display:grid;place-items:center;color:var(--sec);font-size:22px;flex:none}
.compose .in{flex:1;border:1px solid var(--sep);border-radius:18px;padding:7px 14px;color:var(--ter);font-size:16px}

/* 전화 */
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);padding:6px 0 28px;border-top:.5px solid var(--sep);background:rgba(18,18,18,.94)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--sec)}
.tabs button.on{color:var(--tint)}
.tabs svg{width:26px;height:26px}
.seg{display:flex;margin:0 16px 10px;background:#1c1c1e;border-radius:9px;padding:2px}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:13px;font-weight:500;text-align:center;color:#fff}
.seg button.on{background:#636366}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:0 0 0 16px;text-align:left}
.crow .tx{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 0;border-bottom:.5px solid var(--sep)}
.crow .nm{font-size:17px;font-weight:600}
.crow .nm.miss{color:var(--red)}
.crow .kd{font-size:14px;color:var(--sec)}

  if (p && p.group) return `<span class="av ${cls}" style="background:linear-gradient(180deg,#5a7fb8,#3a5a8a)"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="8" cy="9" r="3.2"/><circle cx="16" cy="9" r="3.2"/><path d="M2 20c0-3.6 2.7-6 6-6s6 2.4 6 6zM10 20c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></svg></span>`;
  if (!p || p.unsaved) return `<span class="av ${cls}"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4.5"/><path d="M3 21c0-4.5 4-7.5 9-7.5s9 3 9 7.5z"/></svg></span>`;
  return `<span class="av ${cls}">${esc(p.name.replace(/ .*/,'').slice(0,1))}</span>`;
}
function msgList(){
  const pins = pinnedThreads.map(id => `<button data-th="${id}">${avatar(id)}<span>${esc(people[id].name)}</span></button>`).join('');
  const rows = threadOrder.filter(id => !pinnedThreads.includes(id)).map(id => {
    const m = msgOf(threads[id].at(-1)), p = people[id];
    return `<button class="trow" data-th="${id}">${avatar(id)}<span class="tx"><span class="tp"><span class="nm">${esc(p.name)}</span><span class="tm">${esc(shortDate(m.d,m.t))} ${chev}</span></span><span class="pv">${m.s?esc(sname(m.s))+': ':''}${esc(preview(m))}</span></span></button>`;
  }).join('');
  view(`${nav(null,'',L(['編集','편집']))}<h1 class="large">${L(APPS.msg)}</h1><div class="search">⌕ ${L(['検索','검색'])}</div><div class="scroll"><div class="pinned">${pins}</div>${rows}</div>`);
  $$('#view [data-th]').forEach(b => b.onclick = () => push(() => thread(b.dataset.th)));
}
function thread(id){
  const p = people[id], list = threads[id].map(msgOf);
  let html = '', prev = null;
  const lastIdx = list.length - 1;
  list.forEach((m,i) => {
    const newDay = !prev || prev.d !== m.d;
    const gapH = prev && !newDay && (parseInt(m.t) - parseInt(prev.t) >= 2);
    if (newDay) html += `<div class="cday"><b>${esc(dayLabel(m.d))}</b> ${m.t}</div>`;
    else if (gapH) html += `<div class="cday">${m.t}</div>`;
    const gap = prev && !newDay && prev.me !== m.me ? ' gap' : '';
    if (m.link) html += `<div class="bub link${m.me?' me':''}${gap}"><div class="lk-img"${m.link.img==='pop'?' style="background:linear-gradient(135deg,#fde2ea,#cfe8ff)"':''}>${m.link.img==='pop'?'<span style="font:800 22px/1.1 Helvetica,Arial,sans-serif;color:#e0567a;letter-spacing:.04em;text-align:center">POP UP<br><span style="font-size:13px;color:#5a7fb8">STORE 2022</span></span>':'<svg width="80" height="60" viewBox="0 0 80 60"><path d="M12 44h56l-6 10H18z" fill="#8a5a2b"/><path d="M18 26h44v18H18z" fill="#4a2a14"/><path d="M18 26h44l-4-8H22z" fill="#fff4dc"/><circle cx="40" cy="15" r="4" fill="#c43a2c"/></svg>'}</div><div class="lk-tx">${esc(L(m.link.title))}<small>${m.link.site}</small></div></div>`;
    else if (m.photo) html += `<div class="bub link${m.me?' me':''}${gap}"><div class="lk-img" style="padding:0;height:150px"><svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block"><rect width="200" height="150" fill="#d8cfc0"/><rect x="0" y="105" width="200" height="45" fill="#b7a993"/><rect x="132" y="18" width="46" height="58" fill="#efe7da"/><circle cx="84" cy="52" r="14" fill="#5b4a3c"/><path d="M60 118c0-30 10-48 24-48s24 18 24 48z" fill="#7d8a5a"/><circle cx="112" cy="80" r="9" fill="#5b4a3c"/><path d="M98 120c0-20 6-30 14-30s14 10 14 30z" fill="#c9b37a"/></svg></div></div>`;
    else if (m.loc) html += `<div class="bub loc${m.me?' me':''}${gap}"><svg class="map-img" viewBox="0 0 240 120" preserveAspectRatio="xMidYMid slice"><rect width="240" height="120" fill="#2a2f35"/><path d="M0 70h240M0 30h240M60 0v120M170 0v120" stroke="#3d444c" stroke-width="8"/><path d="M0 95L240 55" stroke="#5a4f2c" stroke-width="6"/><circle cx="120" cy="60" r="9" fill="#ff3b30" stroke="#fff" stroke-width="3"/></svg><div class="lk-tx">${esc(L(m.loc.name))}<small>${esc(L(m.loc.addr))}</small></div></div>`;
    else { if (m.s && !m.me && (!prev || prev.s !== m.s || newDay)) html += `<div style="font-size:11px;color:var(--sec);margin:8px 0 0 12px">${esc(sname(m.s))}</div>`;
      html += `<div class="bub${m.me?' me':''}${gap}">${esc(lang==='ko'?m.ko:m.ja)}</div>`; }
    if (i === lastIdx && m.me) html += `<div class="read">${L(['既読','읽음'])} ${m.d===TODAY?m.t:esc(m.d.slice(5).replace('-','/'))}</div>`;
    prev = m;
  });
  const v = view(`${nav(L(APPS.msg))}<div class="chat-head">${avatar(id,'sm')}<span>${esc(p.name)} ›</span></div>
    <div class="scroll" id="chatScroll"><div class="chat">${html}</div></div>
    <div class="compose"><span class="plus">+</span><span class="in" data-toast='${T(['送信できません','보낼 수 없습니다'])}'>${L(['メッセージ','메시지'])}</span></div>`);
  if (!p.unsaved) v.querySelector('.chat-head').onclick = () => push(() => contact(id));
  const s = $('#chatScroll'); s.scrollTop = s.scrollHeight;
}

function phoneTabs(cur){
  const tabs = [['recent',['履歴','최근 기록'],'<path d="M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'],
    ['contacts',['連絡先','연락처'],'<circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5z" fill="currentColor"/>'],
    ['keypad',['キーパッド','키패드'],[0,1,2].map(r=>[0,1,2].map(c=>`<circle cx="${6+c*6}" cy="${5+r*6}" r="2.2" fill="currentColor"/>`).join('')).join('')+'<circle cx="12" cy="23" r="2.2" fill="currentColor"/>']];
  return `<div class="tabs">${tabs.map(([k,l,s]) => `<button class="${k===cur?'on':''}" data-ptab="${k}"><svg viewBox="0 0 24 26">${s}</svg>${L(l)}</button>`).join('')}</div>`;
}
function bindPhoneTabs(){ $$('#view [data-ptab]').forEach(b => b.onclick = () => { stack = [() => phoneApp(b.dataset.ptab)]; stack[0](); }); }
let recentFilter = 'all';
function phoneApp(tab){

    const list = calls.filter(c => recentFilter === 'all' || c[3] === 'miss');
    body = `${nav(null,`<div class="seg" style="margin:0;width:180px"><button class="${recentFilter==='all'?'on':''}" data-rf="all">${L(['すべて','모두'])}</button><button class="${recentFilter==='miss'?'on':''}" data-rf="miss">${L(['不在着信','부재중'])}</button></div>`,L(['編集','편집']))}
      <h1 class="large">${L(['履歴','최근 기록'])}</h1><div class="scroll">${list.map(c => {
        const p = people[c[2]];
        return `<button class="crow" data-ct="${c[2]}"><span class="tx"><span style="flex:1;min-width:0"><span class="nm${c[3]==='miss'?' miss':''}">${esc(p.name)}${c[5]?` (${c[5]})`:''}</span><br><span class="kd">${kindLabel(c)}</span></span><span class="tm">${esc(shortDate(c[0],c[1]))}</span><svg class="ii" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="9.5"/><path d="M11 9.5v6" stroke-linecap="round"/><circle cx="11" cy="6.5" r=".9" fill="currentColor"/></svg></span></button>`;
      }).join('')}</div>`;
  } else if (tab === 'contacts'){
    let last = '';
    const rows = contactOrder.map(id => { const p = people[id]; let h = '';
      if (p.row !== last){ h += `<div class="idx">${p.row}</div>`; last = p.row; }
      return h + `<button class="lrow" data-ct="${id}">${esc(p.name)}</button>`; }).join('');
    body = `${nav(null,'','+')}<h1 class="large">${L(['連絡先','연락처'])}</h1><div class="search">⌕ ${L(['検索','검색'])}</div><div class="scroll"><div class="me-card"><span class="av lg" style="width:60px;height:60px;font-size:24px">九</span><div><b>九条 真尋</b><small>${L(['マイカード','내 카드'])}</small></div></div>${rows}</div>`;
  } else {
    const keys = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
    body = `${nav(null)}<div class="scroll" style="display:flex;flex-direction:column;align-items:center;padding-top:40px"><div style="height:50px"></div><div class="keys" style="grid-template-columns:repeat(3,78px)">${keys.map(([n,l])=>`<button class="key" style="background:#333" data-toast='${T(['',''])}'><b>${n}</b>${l?`<small>${l}</small>`:''}</button>`).join('')}</div><button style="margin-top:20px;width:78px;height:78px;border-radius:50%;background:var(--green);display:grid;place-items:center" data-toast='${T(['番号を入力してください','번호를 입력하세요'])}'>${icon('phone').replace('url(#gp)','none')}</button></div>`;
  }
  view(body + phoneTabs(tab));
  bindPhoneTabs();
  $$('#view [data-rf]').forEach(b => b.onclick = () => { recentFilter = b.dataset.rf; stack[stack.length-1](); });
  $$('#view [data-ct]').forEach(b => b.onclick = () => push(() => contact(b.dataset.ct)));

    ${hist.length?`<div class="group"><div class="fld"><small>${L(['最近の履歴','최근 기록'])}</small><span class="plain" style="font-size:15px;line-height:1.7">${hist.map(c=>`${esc(dayLabel(c[0]))} ${c[1]}　${kindLabel(c)}`).join('<br>')}</span></div></div>`:''}

/* ================= 캘린더 ================= */
let cal = {y:2022, m:10, sel:TODAY};
const pad = n => String(n).padStart(2,'0');
function calendarApp(){
  const first = new Date(cal.y, cal.m, 1), days = new Date(cal.y, cal.m+1, 0).getDate(), lead = first.getDay();
  let cells = '';
  for (let i=0;i<lead;i++) cells += '<span></span>';
  for (let d=1; d<=days; d++){
    const iso = `${cal.y}-${pad(cal.m+1)}-${pad(d)}`, md = iso.slice(5);
    const has = marks.includes(md) || events[iso];
    const dow = (lead + d - 1) % 7;
    cells += `<button data-day="${iso}" class="${iso===TODAY?'today':''} ${iso===cal.sel?'sel':''}"><span class="n ${dow===0||dow===6?'sun':''}">${d}</span><i class="dot ${has?'on':''}"></i></button>`;
  }
  const md = cal.sel.slice(5);
  const evs = [...(marks.includes(md) ? [['終日','　']] : []), ...(events[cal.sel] || [])];
  const title = lang==='ko' ? `${cal.m+1}월 <span>${cal.y}</span>` : `${cal.m+1}月 <span>${cal.y}</span>`;
  view(`${nav(null,'','')}<div class="cal-head"><h2>${title}</h2><div class="arr"><button data-mv="-1" aria-label="prev">${backChev}</button><button data-mv="1" aria-label="next" style="transform:scaleX(-1)">${backChev}</button></div></div>
    <div class="wk">${[...WD[lang]].map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="scroll"><div class="mon">${cells}</div>
    <div class="evlist"><div class="gtitle" style="padding:8px 16px 4px">${esc(longDate(cal.sel))}</div>${evs.length ? evs.map(e => `<div class="ev"><span class="tm">${e[0]==='終日'?L(['終日','종일']):e[0]}</span><span class="bar" style="${e[1]==='　'?'background:#8e8e93':''}"></span><span class="tt">${esc(L(e[1]))}</span></div>`).join('') : `<div class="empty" style="padding:20px">${L(['予定なし','일정 없음'])}</div>`}</div></div>`);
  $$('#view [data-day]').forEach(b => b.onclick = () => { cal.sel = b.dataset.day; calendarApp(); });
  $$('#view [data-mv]').forEach(b => b.onclick = () => { cal.m += +b.dataset.mv; if (cal.m<0){cal.m=11;cal.y--;} if (cal.m>11){cal.m=0;cal.y++;} calendarApp(); });
}

}

/* ================= 날씨 ================= */
function wxIc(k, s=26){
  const sun = `<circle cx="12" cy="12" r="5" fill="#ffd60a"/>`, moon = `<path d="M15 3a9 9 0 1 0 6 13A7 7 0 0 1 15 3z" fill="#fff"/>`, cloud = `<path d="M7 19a4.5 4.5 0 0 1 .5-9 6 6 0 0 1 11.3 2A3.6 3.6 0 0 1 18 19z" fill="#fff"/>`, rain = cloud + `<path d="M8 21l-1 2M12 21l-1 2M16 21l-1 2" stroke="#5ac8fa" stroke-width="1.6"/>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24">${{sun,moon,cloud,rain}[k]}</svg>`;
}
function weatherApp(){
  const hrs = [[L(['今','지금']),'moon','9°'],['0','moon','8°'],['1','moon','8°'],['2','moon','7°'],['3','moon','7°'],['4','cloud','7°']];
  const days = [[L(['今日','오늘']),'sun','6°','14°'],[L(['金','금']),'sun','7°','16°'],[L(['土','토']),'cloud','9°','17°'],[L(['日','일']),'rain','10°','15°'],[L(['月','월']),'rain','8°','13°'],[L(['火','화']),'sun','6°','14°']];
  view(`<div class="wx"><h2>${L(['東京','도쿄'])}</h2><div class="big">9°</div><div style="font-size:19px">${L(['晴れ','맑음'])}</div><div style="font-size:17px">${L(['最高:14° 最低:6°','최고:14° 최저:6°'])}</div>
    <div class="card"><small>${L(['明け方まで晴れ。日中は最高14°の見込みです。','새벽까지 맑음. 낮 최고 기온은 14°로 예상됩니다.'])}</small><div class="hrs">${hrs.map(h=>`<div><span>${h[0]}${/^\d/.test(h[0])?L(['時','시']):''}</span>${wxIc(h[1])}<b style="font-weight:500">${h[2]}</b></div>`).join('')}</div></div>
    <div class="card"><small>${L(['10日間の天気予報','10일간의 일기예보'])}</small><div class="days">${days.map(d=>`<div><span>${d[0]}</span>${wxIc(d[1],22)}<span style="display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.7)">${d[2]}<span class="rng" style="flex:1"></span><b style="color:#fff;font-weight:500">${d[3]}</b></span></div>`).join('')}</div></div></div>
    <button data-back style="position:absolute;right:16px;bottom:30px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center" aria-label="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>`);
}

/* ================= 카메라 ================= */
function cameraApp(){
  view(`<div class="cam"><div class="vf"><div class="flash" id="flash"></div></div><div class="modes"><span>${L(['タイムラプス','타임랩스'])}</span><span>${L(['ビデオ','비디오'])}</span><b>${L(['写真','사진'])}</b><span>${L(['ポートレート','인물 사진'])}</span><span>${L(['パノラマ','파노라마'])}</span></div>
    <div class="ctrl"><button class="lastp" id="lastp" aria-label="photos"></button><button class="shot" id="shot" aria-label="shutter"><i></i></button><span style="width:46px;height:46px;border-radius:50%;background:#2c2c2e;display:grid;place-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 9a8 8 0 0 1 14-3l2-2v6h-6l2.2-2.2A6 6 0 0 0 6 9zM20 15a8 8 0 0 1-14 3l-2 2v-6h6l-2.2 2.2A6 6 0 0 0 18 15z"/></svg></span></div></div>`);
  $('#shot').onclick = () => { const f = $('#flash'); f.style.opacity = .9; setTimeout(() => f.style.opacity = 0, 120); };
  $('#lastp').onclick = () => openApp(photosApp);
}

/* ================= 지갑 ================= */
function walletApp(){
  const cards = wallet.cards.map((c,i)=>`<div style="height:86px;border-radius:14px;background:linear-gradient(135deg,${c.c[0]},${c.c[1]});margin-top:${i?-40:0}px;padding:14px 16px;display:flex;justify-content:space-between;box-shadow:0 -2px 10px rgba(0,0,0,.35);position:relative"><b style="font-size:15px;font-weight:600">${esc(L(c.n))}</b><span style="font-size:14px;font-variant-numeric:tabular-nums">${esc(c.sub)}</span></div>`).join('');
  let last = '';
  const rows = wallet.tx.map(t => { let h=''; if (t[0]!==last){ h=`<div class="gtitle" style="padding:12px 16px 6px;text-transform:none">${esc(dayLabel(t[0]))}</div>`; last=t[0]; }
    return h+`<div class="cell" style="background:var(--cell)"><span class="sic" style="background:${t[4]==='ic'?'#2f8f5a':'#3b5a8a'}"><svg viewBox="0 0 20 20" fill="#fff"><rect x="3" y="5" width="14" height="10" rx="2"/></svg></span><span class="grow"><span style="display:block">${esc(L(t[2]))}</span><small style="color:var(--sec);font-size:13px">${t[1]}　${t[4]==='ic'?L(['交通系IC','교통카드']):L(['クレジット','신용카드'])}</small></span><span style="font-variant-numeric:tabular-nums">${t[3]}</span></div>`; }).join('');
  view(`${nav(null,'','+')}<h1 class="large">${L(['ウォレット','지갑'])}</h1><div class="scroll"><div style="padding:0 16px 10px">${cards}</div><h2 style="font-size:20px;margin:8px 16px 0">${L(['最近の取引','최근 거래'])}</h2>${rows}</div>`);
}

/* ================= 건강 ================= */
function bars(data, max, color, fmt){
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px">${data.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span style="font-size:10px;color:var(--sec)">${fmt(d[1])}</span><span style="width:100%;border-radius:4px;background:${i===data.length-1?color:color+'99'};height:${Math.max(4,d[1]/max*80)}px"></span><span style="font-size:10px;color:var(--sec)">${d[0]}</span></div>`).join('')}</div>`;
}
function healthApp(){
  const hm = h => `${Math.floor(h)}${L(['時間','시간'])}${Math.round((h%1)*60)}${L(['分','분'])}`;
  const avgS = health.sleep.reduce((a,b)=>a+b[1],0)/health.sleep.length;
  const avgW = Math.round(health.steps.reduce((a,b)=>a+b[1],0)/health.steps.length);
  const card = (title,color,big,sub,chart) => `<div class="group" style="padding:14px 16px"><div style="display:flex;justify-content:space-between;color:${color};font-weight:600;font-size:15px"><span>${title}</span><span style="color:var(--sec);font-weight:400;font-size:13px">${L(['過去7日間','최근 7일'])}</span></div><div style="font-size:28px;font-weight:600;margin-top:6px">${big}</div><small style="color:var(--sec)">${sub}</small>${chart}</div>`;
  view(`${nav(null)}<h1 class="large">${L(['概要','요약'])}</h1><div class="scroll">
    ${card(L(['睡眠','수면']),'#5ac8fa',hm(health.sleep.at(-1)[1]),L(['平均 ','평균 '])+hm(avgS),bars(health.sleep,8,'#5ac8fa',v=>v.toFixed(1)))}
    ${card(L(['歩数','걸음 수']),'#ff9f0a',`${health.steps.at(-1)[1].toLocaleString()}<small style="font-size:15px;color:var(--sec)"> ${L(['歩','걸음'])}</small>`,L(['平均 ','평균 '])+avgW.toLocaleString()+L(['歩','걸음']),bars(health.steps,8000,'#ff9f0a',v=>(v/1000).toFixed(1)+'k'))}
    <div class="group" style="padding:14px 16px"><div style="color:#bf5af2;font-weight:600;font-size:15px">${L(['体重','체중'])}</div><div style="font-size:28px;font-weight:600;margin-top:6px">45.1<small style="font-size:15px;color:var(--sec)"> kg</small></div><small style="color:var(--sec)">${L(['2022年6月24日 健康診断から','2022년 6월 24일 건강검진 기록'])}</small></div>
    <div class="group" style="padding:14px 16px"><div style="color:#ff375f;font-weight:600;font-size:15px">${L(['心拍数','심박수'])}</div><div style="font-size:28px;font-weight:600;margin-top:6px">78<small style="font-size:15px;color:var(--sec)"> ${L(['拍/分','회/분'])}</small></div><small style="color:var(--sec)">${L(['安静時 平均','안정 시 평균'])}</small></div>
  </div>`);
}

/* ================= 스크린 타임 ================= */
function screenTime(){
  const total = Math.round(screen.days.reduce((a,b)=>a+b[1],0)/screen.days.length);
  const max = Math.max(...screen.days.map(d=>d[1]));
  view(`${nav(L(APPS.settings), L(['スクリーンタイム','스크린 타임']))}<div class="scroll" style="padding-top:10px">
    <div class="group" style="padding:14px 16px"><small style="color:var(--sec)">${L(['1日の平均','일일 평균'])}</small><div style="font-size:30px;font-weight:600">${total}${L(['分','분'])}</div><small style="color:var(--sec)">${L(['先週より6%増加','지난주보다 6% 증가'])}</small>
      <div style="display:flex;align-items:flex-end;gap:10px;height:90px;margin-top:12px">${screen.days.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span style="width:100%;border-radius:3px;background:#0a84ff;height:${d[1]/max*70}px"></span><span style="font-size:10px;color:var(--sec)">${WD[lang][i]}</span></div>`).join('')}</div></div>
    <div class="gtitle">${L(['よく使われたもの','가장 많이 사용됨'])}</div>
    <div class="group">${screen.apps.map(a=>`<div class="cell ind"><span class="ic" style="width:30px;height:30px;border-radius:7px;overflow:hidden;display:block;flex:none">${icon(a[0])}</span><span class="grow">${esc(L(APPS[a[0]]))}<span style="display:block;height:4px;border-radius:2px;background:#0a84ff;margin-top:5px;width:${a[1]/screen.apps[0][1]*100}%"></span></span><span class="val">${a[1]}${L(['分','분'])}</span></div>`).join('')}</div>
    <div class="gtitle">${L(['持ち上げ','픽업'])}</div>
    <div class="group"><div class="cell"><span class="grow">${L(['1日の平均','일일 평균'])}</span><span class="val">${L(['21回','21회'])}</span></div><div class="cell"><span class="grow">${L(['持ち上げ後に最初に使用','픽업 후 처음 사용한 앱'])}</span><span class="val">${L(APPS.msg)}</span></div></div>
    <div class="gtitle">${L(['通知','알림'])}</div>
    <div class="group">${screen.notif.map(n=>`<div class="cell"><span class="grow">${esc(n[0])}</span><span class="val">${L(['1日平均 ','일평균 '])}${n[1]}${L(['件','건'])}</span></div>`).join('')}</div>
  </div>`);
}

/* ================= 음악 ================= */
function musicApp(){
  view(`${nav(null)}<h1 class="large">${L(['今すぐ聴く','지금 듣기'])}</h1><div class="scroll">
    <div style="margin:0 16px 18px;padding:14px;border-radius:12px;background:var(--cell);color:var(--sec);font-size:14px">${L(['まだ何も再生していません。気になるプレイリストから聴いてみましょう。','아직 재생한 항목이 없습니다. 마음에 드는 플레이리스트부터 들어 보세요.'])}</div>
    <h2 style="font-size:22px;padding:0 16px 10px;margin:0">${L(['おすすめプレイリスト','추천 플레이리스트'])}</h2>
    <div class="mgrid">${music.recs.map((p,i)=>`<button data-pl="${i}"><div class="art" style="background:linear-gradient(135deg,${p.c[0]},${p.c[1]})"></div>${esc(L(p.n))}<small style="display:block;color:var(--sec)">${L(['ミュージック編集部','음악 편집부'])}</small></button>`).join('')}</div></div>`);
  $$('#view [data-pl]').forEach(b => b.onclick = () => push(() => { const p = music.recs[+b.dataset.pl];
    view(`${nav(L(['今すぐ聴く','지금 듣기']))}<div class="scroll" style="text-align:center;padding:10px 40px 40px"><div style="aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,${p.c[0]},${p.c[1]});box-shadow:0 10px 30px rgba(0,0,0,.5)"></div><h2 style="margin:16px 0 4px;font-size:22px">${esc(L(p.n))}</h2><div style="color:var(--sec);font-size:14px">${L(['ミュージック編集部','음악 편집부'])}</div><div style="display:flex;gap:12px;margin-top:18px"><button style="flex:1;background:var(--cell);border-radius:10px;padding:12px;color:var(--red);font-weight:600" data-toast='${T(['登録が必要です','구독이 필요합니다'])}'>▶ ${L(['再生','재생'])}</button><button style="flex:1;background:var(--cell);border-radius:10px;padding:12px;color:var(--red);font-weight:600" data-toast='${T(['登録が必要です','구독이 필요합니다'])}'>⤨ ${L(['シャッフル','셔플'])}</button></div></div>`); }));
}

renderStatic();
show('lock');

</script>
